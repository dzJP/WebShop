# DataSource Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.show-sql=true
spring.resources.static-locations=classpath:/static/

# BankID Keystore Configuration
bankid.keystore.path=classpath:FPTestcert5_20240610.p12
bankid.keystore.password=qwerty123
bankid.keystore.alias=1

# BankID API Endpoints
bankid.api.base-url=https://appapi2.test.bankid.com/rp/v5.1
bankid.api.authenticate-endpoint=/authenticate
bankid.api.status-endpoint=/status

# Server Configuration
server.port=8443
server.ssl.key-store=classpath:FPTestcert5_20240610.p12
server.ssl.key-store-password=qwerty123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=1
server.ssl.enabled=true


# JWT Configuration
token.secret.key=${TOKEN_KEY}
token.expirationms=3600000

# Hibernate Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Email Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

logging.level.com.example.webshoplabb.services.BankIdService=DEBUG
logging.level.com.example.webshoplabb.controllers.BankIdController=DEBUG
